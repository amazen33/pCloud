[defaults]
# The real inventory is git-ignored: copy inventory/hosts.example.yml to
# inventory/hosts.yml and replace every SYNTHETIC value with facts read from
# the real disks by inspect-disks.yml.
inventory = inventory/hosts.yml
# Host keys are verified, never disabled. Add each node's key to known_hosts
# only after comparing its fingerprint with the one shown on the VM console.
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
forks = 5

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
pipelining = True
