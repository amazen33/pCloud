name: "Infrastructure gate: deploy/"
on:
  workflow_dispatch:
  push:
    paths: ["deploy/**", "tests/**", "tools/**", ".github/workflows/infra.yml"]
  pull_request:
    paths: ["deploy/**", "tests/**", "tools/**", ".github/workflows/infra.yml"]
permissions:
  contents: read
# Static checks only. Nothing here can reach the Hyper-V hosts or change
# infrastructure: `tofu apply` and the Ansible playbooks are run by a human
# (development contract: no infrastructure action without explicit approval).
jobs:
  layer0:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: opentofu/setup-opentofu@v1
        with:
          # Plain tofu binary: the wrapper rewrites stdout and exit codes,
          # which the Layer 0 tests read.
          tofu_wrapper: false
      - name: Verify standalone Layer 0 (the directory's one test command)
        shell: pwsh
        run: ./deploy/00-infra/private-hyperv/tests/verify.ps1 -RunTofu

  ansible:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/01-k8s-engine/rke2-ansible
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install ansible-core
      - name: Layer 1 standalone syntax and inventory checks
        run: bash tests/verify-layer1.sh

  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Layer 2 test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Install pinned validation tools with checksum verification
        run: bash tools/install-validation.sh
      - name: Verify standalone Layer 2 package, render and schemas
        run: python deploy/02-cluster-addons/tests/verify-layer2.py --render
      - name: Verify standalone lab storage, render and schemas
        run: python deploy/02-cluster-addons/storage/local-path/tests/verify-storage.py --render
      - name: Verify standalone lab secrets, local TLS, render and schemas
        run: python deploy/02-cluster-addons/secrets/openbao/tests/verify-secrets.py --render
